name: transactional-engine

x-php-base: &php-base
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
    args:
      PHP_VERSION: "8.3"
  env_file:
    - path: .env
      required: true
    - path: .env.local
      required: false
  environment:
    APP_ENV: ${APP_ENV:-dev}
    DATABASE_URL: postgresql://app:app@postgres:5432/app?serverVersion=16&charset=utf8
    MESSENGER_TRANSPORT_DSN: amqp://app:app@rabbitmq:5672/%2f/messages
    REDIS_URL: redis://redis:6379
    LOCK_DSN: redis://redis:6379
  volumes:
    - ./:/var/www/app:cached
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  php:
    <<: *php-base
    container_name: te_php
    volumes:
      - ./:/var/www/app:cached
      - php_socket:/var/run/php

  nginx:
    image: nginx:1.27-alpine
    container_name: te_nginx
    depends_on:
      - php
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - php_socket:/var/run/php
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  messenger_worker:
    <<: *php-base
    container_name: te_worker
    command: >
      php bin/console messenger:consume async_domain_events async_webhooks
      --limit=512 --time-limit=3600 --memory-limit=192M --failure-limit=10 -v
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "bin/console", "messenger:stats"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: te_postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: te_redis
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: te_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
      RABBITMQ_DEFAULT_VHOST: "/"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  php_socket:
