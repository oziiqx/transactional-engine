[www]
user = app
group = app

; nginx reaches php-fpm over TCP on the compose network.
listen = 0.0.0.0:9000
listen.backlog = 511

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Expose a FastCGI status/ping endpoint for the container healthcheck.
pm.status_path = /fpm-status
ping.path = /fpm-ping

; Surface worker output in the container log stream.
catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2

; Do not strip the environment — Symfony reads DATABASE_URL et al. from it.
clear_env = no
