monolog:
    channels:
        - deprecation
        - domain_event
        - webhook
        - reconciliation

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: 'php://stderr'
                level: debug
                channels: ['!event', '!deprecation']
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ['!event', '!doctrine', '!console']

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405, 422]
            nested:
                type: stream
                path: 'php://stderr'
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405, 409, 422]
                buffer_size: 50
            nested:
                type: stream
                path: 'php://stderr'
                level: notice
                formatter: monolog.formatter.json
            domain_event:
                type: stream
                path: 'php://stdout'
                level: info
                channels: ['domain_event']
                formatter: monolog.formatter.json
            deprecation:
                type: stream
                channels: [deprecation]
                path: 'php://stderr'
